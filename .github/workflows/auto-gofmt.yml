name: auto-gofmt

# Ported from rabbeet/Pulse @ 74cf64d5 / auto-pint.yml (PUL-235 M3,
# 2026-05-23) as part of the Approach C lift-and-shift.
#
# Auto-fix gofmt drift on agent-* PRs. Runs `gofmt -w server/`, commits the
# diff back as `[autofix] gofmt`, and pushes via GH_AUTOFIX_TOKEN so the
# resulting push retriggers CI (gofmt diff is one of CI's failure modes —
# multica's CI runs `go build ./...` which doesn't fail on format alone, but
# the OpenCode review prompt instructs the reviewer to refuse style nits,
# meaning unformatted code becomes a noisy review distraction).
#
# Multica deltas vs Pulse source:
#   - `vendor/bin/pint --parallel` → `gofmt -w server/`. No `setup-php` /
#     `composer install` — Go ships `gofmt` with the toolchain via setup-go.
#   - Author identity kept as `pulse-autofix-bot` (matches Pulse) — the
#     loop-guard pattern (skip if HEAD authored by the bot) MUST match across
#     repos because we share `GH_AUTOFIX_TOKEN`. Changing the email would
#     also require coordinating PAT identity changes. Future PUL-236
#     extraction may unify into `multica-autofix-bot` — out of scope here.
#   - JS/TS autofix (e.g. ESLint --fix) is OUT OF SCOPE for M3: pint covered
#     ~80% of Pulse agent-PR red-CI because it's a per-line stylistic checker.
#     Multica's ESLint config (`packages/eslint-config/`) is mostly correctness
#     rules — autofix is small-value and high-blast-radius. Re-evaluate after
#     observing actual multica agent-PR red-CI causes (M2 telemetry will help).
#
# Scope: agent-* branches only. Human-developer PRs are not auto-rewritten;
# agents own their branches end-to-end.
#
# Loop guard: a successful autofix push triggers `synchronize`, which would
# re-run this workflow. Early-exit if HEAD's commit is authored by
# `pulse-autofix-bot`.
#
# Required secret: GH_AUTOFIX_TOKEN. GITHUB_TOKEN cannot be used — pushes by
# GITHUB_TOKEN do not trigger downstream workflow runs (intentional GitHub
# policy), and we *want* the trigger so the lint job re-runs and goes green.
# PAT rotation: refresh annually. If the PAT expires the workflow fails at
# `actions/checkout` with 401 — visible as a red workflow run; PRs are not
# blocked (auto-gofmt is not a required check) but stop being auto-fixed.

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: auto-gofmt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autogofmt:
    if: startsWith(github.event.pull_request.head.ref, 'agent-')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: PAT presence check
        id: pat_check
        env:
          PAT: ${{ secrets.GH_AUTOFIX_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
              echo "::warning::GH_AUTOFIX_TOKEN not configured — auto-gofmt skipped"
              echo "skip=true" >> "$GITHUB_OUTPUT"
          else
              echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Loop guard — exit if HEAD is autofix-bot's commit
        id: guard
        if: steps.pat_check.outputs.skip != 'true'
        # Read-only commit lookup — github.token (auto-injected GITHUB_TOKEN)
        # is sufficient. GH_AUTOFIX_TOKEN is reserved for write-side steps
        # (checkout token + push) where it must be the trigger-eligible PAT.
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          author=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA" \
            --jq '.commit.author.email + " " + .commit.author.name')
          echo "head author: $author"
          if echo "$author" | grep -qE '(pulse-autofix-bot|autofix@pulse)'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::HEAD authored by autofix bot — skipping to prevent loop"
          else
              echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head
        if: steps.pat_check.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GH_AUTOFIX_TOKEN }}
          fetch-depth: 0

      - name: Setup Go
        if: steps.pat_check.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run gofmt (apply fixes)
        if: steps.pat_check.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        run: |
          # Apply formatting in place. gofmt exits 0 even if nothing changed;
          # `git diff --quiet` below decides whether to commit.
          gofmt -w server/

      - name: Commit + push if dirty
        if: steps.pat_check.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        run: |
          if git diff --quiet; then
              echo "no gofmt changes — exit clean"
              exit 0
          fi
          git config user.name 'pulse-autofix-bot'
          git config user.email 'autofix@pulse.dev'
          git add -A
          git commit -m '[autofix] gofmt

          Auto-applied by .github/workflows/auto-gofmt.yml.
          PUL-235 M3 — auto-fix gofmt drift on agent-* PRs.'
          git push
