# Project name is parameterized so operator-deploy environments can override
# it (e.g. `multica-prod` in /opt/multica-server/docker-compose.local.yml)
# while plain `docker compose up` from a dev checkout or an agent worktree
# defaults to `multica-dev`. Sharing the literal name `multica` between prod
# and worktrees lets any worktree's compose-up silently replace prod
# containers — see PUL-188 for the incident.
name: ${COMPOSE_PROJECT_NAME:-multica-dev}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # PUL-266: gotenberg sidecar for the issue PDF export. Chromium-
  # backed HTML → PDF service. Backend reaches it via
  # GOTENBERG_URL=http://localhost:${GOTENBERG_PORT:-3001} when the
  # server runs on the host (default in dev). When the backend
  # itself runs in compose, point at http://gotenberg:3000 from the
  # service name. The dev port maps host:3001 → container:3000 to
  # avoid clashing with the frontend dev server on host:3000.
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "${GOTENBERG_PORT:-3001}:3000"
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --api-timeout=30s

volumes:
  pgdata:
